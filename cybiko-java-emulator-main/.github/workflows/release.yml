name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Read version
        id: version
        run: |
          BASE_VERSION=$(cat emulator/VERSION | tr -d '[:space:]')
          FULL_VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          TAG="v${FULL_VERSION}"
          echo "version=${FULL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "base=${BASE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build distribution
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew build distZip

      - name: Rename assets for release labeling
        env:
          EMU_VER: ${{ steps.version.outputs.version }}
        run: |
          cp "emulator/build/distributions/cybiko-emulator-${EMU_VER}.zip" \
             "emulator/build/distributions/Cybiko-Emulator-${EMU_VER}.zip"
          cp emulator/build/libs/emulator-${EMU_VER}-all.jar \
             "emulator/build/libs/Cybiko-Emulator-${EMU_VER}.jar"
          MGR_VER=$(cat manager/VERSION | tr -d '[:space:]')
          MGR_FULL="${MGR_VER}.${GITHUB_RUN_NUMBER}"
          cp "manager/build/distributions/cybiko-nvram-manager-${MGR_FULL}.zip" \
             "manager/build/distributions/Cybiko-NVRAM-Manager-${MGR_FULL}.zip"
          cp "manager/build/libs/manager-${MGR_FULL}-all.jar" \
             "manager/build/libs/Cybiko-NVRAM-Manager-${MGR_FULL}.jar"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Cybiko Emulator ${{ steps.version.outputs.tag }}"
          body: |
            ## Cybiko Emulator ${{ steps.version.outputs.tag }}

            ### Downloads
            - **Cybiko-Emulator-${{ steps.version.outputs.version }}.jar** — single-file fat JAR (easiest, just `java -jar`)
            - **Cybiko-Emulator-${{ steps.version.outputs.version }}.zip** — full distribution with launch scripts
            - **Cybiko-NVRAM-Manager .jar** — NVRAM manager fat JAR (just `java -jar`)
            - **Cybiko-NVRAM-Manager .zip** — NVRAM manager with launch scripts

            All require [Java 21+](https://adoptium.net/).

            ### Quick Start
            ```bash
            # Cybiko Xtreme
            java -jar Cybiko-Emulator-${{ steps.version.outputs.version }}.jar cyrom150.bin cyos_v1508.bin

            # Cybiko Classic V1
            java -jar Cybiko-Emulator-${{ steps.version.outputs.version }}.jar --machine v1 cyrom112.bin flash_v1246.bin

            # Load an app with persistent NVRAM
            java -jar Cybiko-Emulator-${{ steps.version.outputs.version }}.jar cyrom150.bin cyos_v1508.bin --nvram cybiko.nvram --app calc.app
            ```

            See the [README](https://github.com/daberkow/cybiko-java-emulator#quick-start) for full usage and ROM download links.
          files: |
            emulator/build/libs/Cybiko-Emulator-*.jar
            emulator/build/distributions/Cybiko-Emulator-*.zip
            manager/build/libs/Cybiko-NVRAM-Manager-*.jar
            manager/build/distributions/Cybiko-NVRAM-Manager-*.zip
          generate_release_notes: true
