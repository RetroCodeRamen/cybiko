plugins {
    id 'application'
    id 'idea'
    id 'com.github.ben-manes.versions'
    id 'com.gradleup.shadow' version '9.6.1'
}

// Read version from VERSION file, with optional build number from CI
version = file('VERSION').text.trim() + (System.getenv('BUILD_NUMBER') ? ".${System.getenv('BUILD_NUMBER')}" : '')

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava
}

application {
    // Define the main class for the application.
    mainClass = 'com.github.daberkow.CybikoEmulator'
    applicationName = 'cybiko-emulator'
}

distributions {
    main {
        distributionBaseName = 'cybiko-emulator'
    }
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
