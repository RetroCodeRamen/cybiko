plugins {
    id 'application'
    id 'idea'
    id 'com.github.ben-manes.versions'
    id 'com.gradleup.shadow' version '9.6.1'
    alias(libs.plugins.javafx)
}

version = file('VERSION').text.trim() + (System.getenv('BUILD_NUMBER') ? ".${System.getenv('BUILD_NUMBER')}" : '')

javafx {
    version = libs.versions.javafx.get()
    modules = ['javafx.controls']
}

dependencies {
    implementation libs.atlantafx.base
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'com.github.daberkow.cybiko.manager.App'
    applicationName = 'cybiko-nvram-manager'
}

distributions {
    main {
        distributionBaseName = 'cybiko-nvram-manager'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

shadowJar {
    // JavaFX fat JARs need a non-Application main class to bypass module checks
    manifest {
        attributes 'Main-Class': 'com.github.daberkow.cybiko.manager.Launcher'
    }
    mergeServiceFiles()
}
